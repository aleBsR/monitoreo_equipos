# =============================================================================
# SDMR - Configuración del Agente (ejemplo)
# =============================================================================
# Copiá este archivo como `config.ini` en esta misma carpeta (o dejá que lo
# escriba scripts/instalar_agente.bat / instalar_agente.sh).
#
# Es OPCIONAL: si `ip_servidor` queda vacío, el agente descubre al Servidor
# Central solo, emitiendo SRVREQ por broadcast hasta recibir SRVINFO.
#
#   [nodo]
#   id_nodo      = Identificador del equipo en el dashboard.
#                  Vacío o ausente = nombre de la máquina (hostname).
#   [red]
#   ip_servidor  = IP del equipo donde corre server/server.py.
#                  Vacío o "-" = descubrimiento automático por broadcast.
#   puerto_udp   = Puerto UDP de telemetría del servidor (5000).
#   puerto_cmd   = Puerto TCP LOCAL de comandos EXEC de este agente (5002).
#   intervalo    = Segundos entre envíos de telemetría (3).
# =============================================================================

[nodo]
id_nodo =

[red]
ip_servidor =
puerto_udp = 5000
puerto_cmd = 5002
intervalo = 3
